 第三项建议是维护私域：公域流量属于平台，平台会迭代；尽量把可触达用户沉淀到自己能够持续联系的渠道。 | 约105秒附近出现手机内容截图拼贴，结尾以“把公域流量转过来”收束。 |\n\n这条把一个创作者遭遇作为引子，顺序为“平台判罚的不确定—平台规则与敏感领域—换平台/维护私域”。中心观点不是具体教人申诉，而是建议接受平台规则或选择其他承载渠道。案例能说明讲述者为何形成该建议，但单个转述不足以证明平台审核的普遍机制；“补资质仍易违规”“视频号更友好”等均应视为她的经验判断，不能当成经独立验证的事实。\n\n表现上，前段以活动图片和评论截图建立“亲历见闻”语境，其余主要是正面近景讲述，字幕承担论点提纲；后半每个建议均用序数词/手势切分，便于快速跟随。联系表可见截图出现于约2–8、36–38、55–57、78–85及105–107秒。自动帧差候选高点约1.7、5.1、8.7和80.7–84.1秒，已在2fps联系表核看，反映插图/截图转换候选；它们不是语义检测结果，也不代表逐原帧复核。\n\n## 局限与复核范围\n\n已查看本片全部14页、0–106.5秒的2fps联系表，以及ASR分段；ASR中“违规、婚介、资质、视频号、私域”等词有明显识别错误，以上以可辨字幕及上下文校正大意，非逐字稿。页面章节摘要仅作辅助。未播放音轨，故不评价音色、语调、配乐或停顿。全帧机械扫描记录应以对应frame_scan及metadata为准；本复盘仅覆盖联系表抽帧、时间锚点和可见叠图，不声称逐原帧分析，也不核验平台规则或商业结果。建议原帧重点回看1.7–2.5秒开场画面变化、7–8.5秒评论图、80.6–84.1秒案例截图及105–107秒结尾截图，以辨认叠图可读性与字幕衔接。\n", "ocr": "本条没有独立OCR时间线。烧录字幕仍在完整视频中。", "media": {"id": "7642198121565146484", "publication_time": "2026-05-21 12:31", "pinned": false, "title": "关于“违规”这件事#自媒体 #个人ip", "public_url": "https://www.douyin.com/video/7642198121565146484", "file": "videos/7642198121565146484.mp4", "mode": "av1_480_crf42", "source_bytes": 14514326, "package_bytes": 5940308, "source_video": {"codec_name": "h264", "width": 720, "height": 1280, "r_frame_rate": "30/1", "nb_frames": "3199", "duration": "106.633333"}, "package_video": {"codec_name": "av1", "width": 480, "height": 854, "r_frame_rate": "30/1", "nb_frames": "3199", "duration": "106.633333"}, "package_audio": {"codec_name": "aac", "channels": 1, "sample_rate": "44100", "duration": "106.649002"}, "full_decode_pass": true, "frame_count_match": true, "sha256": "85ab32b54ad19ad984a3804cf6c9bf6542689b455ba170713039af0cc5ee18e0", "elapsed_seconds": 39.94}}, {"id": "7642284257615875379", "publication_time": "2026-05-21 18:06", "title": "看完了再决定自己要不要做自媒体 #短视频 #自媒体 #个人IP", "pinned": false, "public_url": "https://www.douyin.com/video/7642284257615875379", "segments": [{"start": 0.0, "end": 3.98, "text": "OK 所有人都在告诉你说现在自媒体多赚钱一定要做个人IP对吧"}, {"start": 3.98, "end": 5.08, "text": "这个我不否认"}, {"start": 5.08, "end": 9.82, "te 准表述。\n- **00:20–00:40｜说明创作者痛点。** 画面穿插会场、观众与她在电脑前整理资料的镜头；字幕讲文章、经验和方法论虽多，但复用、整理和持续互动时接不起来。人物镜头与工作场景为“材料零散”提供视觉对应。\n- **00:40–00:57｜从发布转向积累。** 会场演讲、活动展板和产品页轮换；她对比过去内容发布后容易被遗忘，和现在可沉淀、积累并被反复调用的思路，也提到用户可围绕知识库继续提问。关于产品带来的持续互动属于讲述主张，视频未提供独立效果数据。\n- **00:58–01:11｜引出 Skill 广场。** 现场讲者和 ima 展示画面切换，字幕突出把流程化方法封装成可调用的 Skill；自拍近景补充“把我会的变成别人也能用”。演示字幕与她的口播是两层证据，现场展示不等同于验证实际使用效果。\n- **01:11–01:29｜列三项内容策略。** 自拍与展位镜头交替，字幕依次列出：碎片内容变体系、个人经验变可检索知识库、把重复投入的流程方法封装为 Skill。三项并列便于记忆，是全片最清楚的结构节点。\n- **01:29–01:48｜把整理连接到用户需求。** 她进一步说可从用户关心什么、持续问什么来分析，使后续内容、服务和产品更准确；字幕配合台上产品界面。这是从资产整理到需求洞察的论证连接，但没有出现具体分析案例或前后转化数据。\n- **01:48–01:59.6｜商业化收束。** 画面回到会场与舞台，字幕将单条内容爆发与订阅、长期服务并置，最后落到长期知识资产沉淀。结尾重申观点，没有新增步骤或可量化证据。\n\n## 可学习点与局限\n\n现场纪实素材（签到、听讲、记录、展板）持续支撑自拍讲述，不只是纯口播；近景、远景与产品界面交替，字幕将抽象话题拆成三项清单。开头先借AI降低内容生产门槛的趋势设问，再用“产量”与“可复用资产”转换价值判断，最后落到用户问题和长期服务。可迁移的是以亲历场景承接观点，再把抽象概念拆成可识别动作。局限是产品展示具有推广属性，产品体验、知识库质量、订阅收入和用户留存均未独立验证；会场屏幕小字部分不宜据画面作细读。ASR有大量错词，已对照画面字幕校准可辨词义；本目录无独立`ocr.json`或`subtitle_timeline.md`。未输入音轨，不评价声音、配乐或语调。\n\n## 画面核验范围\n\n采用**全帧机械扫描 + 2fps视觉初读/候选复核**，不声称语义查看每张原始帧。完整查看2fps联系表`contact_01.jpg`–`contact_15.jpg`（全片0–119.5秒）与候选复核表`review_001.jpg`–`review_012.jpg`；另抽检差异候选附近原始帧`frame_000271.jpg`（展板/自拍转场）、`frame_000691.jpg`（现场投影）、`frame_001171.jpg`（台上知识资产总结）、`frame_002431.jpg`（知识库列表展示）。建议主代理复核约00:40前后“累积/反复调用”的字幕切换、00:58 Skill广场转场、01:19三项策略卡与01:34用户问题演示页；大屏细字需以原片放大核对。\n\n## 与其他视频的关系\n\n本片实发于2026-06-04，主题是AI环境下的知识资产沉淀和产品化。若要与教培IP/获客视频比较，应在`chronological40`中按真实日期和单片论点互证；当前不据主页相邻顺序推导延续或变化。\n", "ocr": "本条没有独立OCR时间线。烧录字幕仍在完整视频中。", "media": {"id": "7647381882178374931", "publication_time": "2026-06-04 11:47", "pinned": false, "title": "AI时代能赚钱的博主都很会构建「个人知识库」 今天参加 ima OpenDay。最大的感触是：AI时代，内容越来越容易生产。但真正值钱的，是你沉淀下来的知识资产。以前做自媒体：发一条内容，价值只存在一天。现在如果能把经验、案例、观点持续沉淀到知识库里。一次输出，未来可能被反复搜索、反复调用、反复使用。内容是消耗品。知识资产却有机会持续产生价值。这也是我看到 ima知识号 最有感触的一点。它不只是发内容。而是在帮创作者把碎片化输出，慢慢沉淀成自己的知识资产。未来创作者拼的可能不再是谁更新得快。而是谁拥有更多可复用、可积累、可变现的知识资产。 #ima知识号 #知识资产 #AI工具 #自媒体运营 #知识库", "public_url": "https://www.douyin.com/video/7647381882178374931", "file": "videos/ , "end": 254.7, "text": "愿意为教育价值卖单的家长"}], "report": "# 7647845197472189722｜2026-06-05 17:45\n\n时长约254.79秒。主题是教培账号如何避免吸引错位流量，并用差异化、精准定位和过程呈现吸引重视教育价值的家庭。以下以本片可见表达为据；其中案例与结果数字均为创作者自述/展示，不能当作独立验证的经营数据。\n\n## 时间线与证据\n\n- **00:00–00:09｜案例引入。** 女创作者坐在桌前对镜讲述，穿插客户聊天/成果拼图，画面出现“200播放”与“37万”等数字及咨询付款类截图。她用低播放内容带来高价值客户的反差提出问题；截图只能证明视频展示了这些材料。\n- **00:09–00:23｜界定目标客群。** 她把一些教培账号的困境归因为内容吸引了错误人群，并以黑底圆形画面卡列出愿为优质教育付费、看重实际效果及高端家长等对象。随后提到营造氛围、展示学生成果、分享学习方法等常见做法仍可能解决不了获客对象错位。\n- **00:24–00:44｜用反问演示错配。** 镜头回到讲述者，她模仿“能不能便宜点、先免费试听、别家更便宜”等咨询情境，再归结为内容把不匹配的客户吸引来了；手势和表情配合角色化反问，最后举手提示接下来讲五类不宜发布的视频。\n- **00:45–01:07｜误区一：替家长讲授如何教孩子。** 屏幕举出教单词、注意力小游戏、奥数等内容例子；解释是目标家长想把孩子的学习问题交给专业老师解决，而不是再学一套家长教学教程。画面在口播与黑底说明卡之间切换，核心是把选题从“家长自己怎么教”转向“老师如何解决孩子的问题”。\n- **01:08–01:26｜误区二：堆专业术语。** 她举“建构式教学”“认知负荷”等术语，建议换成普通家长能理解的孩子问题和解决方式。字幕卡与人物镜头交替，表达上先给出术语反例，再转为白话解释，降低理解门槛。\n- **01:27–01:43｜误区三：套路式夸张钩子。** 以“99%家长不知道”一类标题为例，指出观众容易识别营销套路，进而觉得不真诚、难以信任。讲述者用指点和强调手势呈现反例，论据是受众可能形成的观感，并非本片提供的实测数据。\n- **01:44–02:16｜误区四：只晒结果，不讲过程。** 她谈到只展示成绩、升学或录取结果会让家长看不到老师如何诊断、沟通、激励和调整；画面插入钢琴教学/学生片段及过程示例。她认为缺少过程会使展示显得被筛选、让家长担心真实性。可学习点是把服务步骤和具体判断过程放进内容，而非只放成果图。\n- **02:17–02:38｜误区五：追所有热点。** 以幼小衔接、高考志愿、留学等宽泛热点为例，指出话题过散会引来不匹配流量；她把理想受众描述为本地、可到店且有相应支付能力的家庭。此处是定位主张，不代表仅靠地域标签就能筛出付费客户。\n- **02:39–03:10｜正向做法一：展示真实差异。** 从“五类不要做”转到三件值得做的事。她用退款处理、挑选合适老师、课后讨论孩子情绪、关注压力等对照说明差异要落在具体服务动作上，而不是只喊口号。案例由创作者自述，适合作为内容呈现范例，不能据此验证其机构实践。\n- **03:11–03:32｜正向做法二：明确服务谁。** 举幼小至小学、奥数、备考、艺术/编程、一对一等定位例子，并给出北京海淀六年级数学培优等更具体的本地场景。她建议账号名称、内容和场景保持一致，让目标家长更容易识别是否相关；本片没有展示定位调整前后的量化效果。\n- **03:33–03:52｜正向做法三：呈现负责的过程。** 她建议展示备课、分析试卷、鼓励孩子、向家长反馈和调整计划等日常动作。画面仍以口播与说明文字为主，论点是可见过程比泛泛服务承诺更能让家长理解服务价值。\n- **03:53–04:14.79｜收束。** 回到理解家长顾虑、认真对待每个学生的主张，归纳方向清楚、内容相关且持续表达，才有机会吸引愿为教育价值付费的家庭。结尾是原则性总结，没有呈现新的案例验证。\n\n## 可学习表达与局限\n\n结构上先用“播放低、客户价值高”的反差引题，再将内容拆成五个反例和三个正向动作；每点均用具体话题、对话或服务情境解释，最后回到受众定位。人物口播、手势、黑底文字卡与案例拼图交替，信息层级清晰。可迁移的是把抽象的“精准获客”拆成选题对象、用词、过程证据和服务差异等可执行问题。局限是关键业绩数字和服务案例来自账号自身展示，无法独立核实；本片也没有量化比较上述做法的效果。ASR有多处错词，已以画面可辨字幕校正主题词；本目录无独立`ocr.json`及`subtitle_timeline.md`，因此不能声称完成了OCR逐帧校订。未使用音频输入，不评价音色、配 结尾字幕强调陪伴完成实践。contact_11.jpg—contact_12.jpg、review_008.jpg—review_009.jpg；frame_002617.jpg（约87.2秒）核验最后一句。 |\n\n## 可学习的表达方法\n\n- **用具体情境证明服务过程：**以深夜修改一条学员作品开篇，随后给出聊天截图和逐项建议，比抽象宣称“陪跑有用”更具象；不过截图是创作者选择展示的片段。\n- **把问题拆成可诊断维度：**文案、场景/机位、姿势氛围和表达状态形成逐级排查思路，使“大概不对”变成可讨论的具体问题。\n- **先承认用户已经学过，再解释卡点：**没有简单归因为不努力，而是把“知识输入”与“真实作品反馈”之间的落差作为核心论点。\n- **从案例过渡到服务定位：**先讲一位学员的修改反馈，再转为不卖单课、做一对一陪跑的理由，论证顺序清晰；结尾回扣“真正做会”。\n\n## 局限与复核依据\n\nASR 全时段分段已读，转录整体可辨但存在错字，诸如学员、私教等上下文须以视频字幕和画面校正；未把聊天记录细节误当作独立验证事实。此目录没有 ocr.json 与 subtitle_timeline.md，字幕核对依据为各联系表和候选帧中实际可读的屏幕字。未播放音轨，因此不评价音色、语调、配乐或停顿。聊天截图里的账号/个人信息有模糊遮挡，也无法确认学员反馈的代表性或陪跑效果。\n\n核验范围：全帧机械扫描报告为2647/2647帧读取、0缺失、135个变化候选及9页候选复核表。完成**2fps视觉初读**全部12页（contact_01.jpg—contact_12.jpg）及**候选复核**全部9页（review_001.jpg—review_009.jpg）；并在聊天切换、论点转场及收尾附近抽查原始帧 all_frames/frame_000120.jpg、frame_000500.jpg、frame_000850.jpg、frame_001200.jpg、frame_001450.jpg、frame_001700.jpg、frame_002050.jpg、frame_002450.jpg、frame_002610.jpg。该方法是全帧机械扫描加2fps视觉初读/候选复核，不代表语义查看了每一张原始帧。\n\n## 与其他作品的关系候选\n\n本片具体讲“课程原则与单条作品诊断”的差异。是否与同一时期的其他陪跑或获客内容形成延续，需要以实际发布时间和逐条证据核对；在此不从主页相邻顺序推断，未互证前不下变化结论。\n\n", "ocr": "本条没有独立OCR时间线。烧录字幕仍在完整视频中。", "media": {"id": "7648164755579866431", "publication_time": "2026-06-06 14:25", "pinned": false, "title": "自媒体 | 课程vs私教，区别在哪里？ #IP陪跑 #自媒体创业 #新手博主 #个人IP #短视频运营", "public_url": "https://www.douyin.com/video/7648164755579866431", "file": "videos/7648164755579866431.mp4", "mode": "av1_480_crf42", "source_bytes": 15057740, "package_bytes": 6923776, "source_video": {"codec_name": "h264", "width": 720, "height": 1280, "r_frame_rate": "30/1", "nb_frames": "2647", "duration": "88.233333"}, "package_video": {"codec_name": "av1", "width": 480, "height": 854, "r_frame_rate": "30/1", "nb_frames": "2647", "duration": "88.233333"}, "package_audio": {"codec_name": "aac", "channels": 1, "sample_rate": "44100", "duration": "88.236009"}, "full_decode_pass": true, "frame_count_match": true, "sha256": "04e07cfaddfcfe4e89a02559c372ad6804ab046978f7cb94d922454d0ef4a2b2", "elapsed_secon 8.42, "text": "我们上次媒体感兴关注我吧"}], "report": "# 7649667628167892259｜口播表现力的两阶段练习\n\n**实际发布时间：**2026-06-10 15:37（本地 metadata）  \n**时长：**约118.47秒。视频主体为室内单人竖屏口播，讲话者穿白色露肩上衣，背景有柜子和亮屏电视；中段手持手机演示对话对象想象。未见贯穿全片的场景切换。\n\n## 时间线观察\n\n| 时间 | 主张与口播线索 | 可见表现及画面依据 |\n|---|---|---|\n| 0:00–0:13 | 将表现力进阶概括为由不敢看镜头到自然、再到更有感染力，并自述自己走过这两个阶段。 | 开场近景快速靠近镜头、挥手、张开手指数数；屏幕字同步给出“一个人拍视频的表现力”“大概分为两个阶段”。见 contact_01.jpg。 |\n| 0:13–0:29 | 第一阶段先求自然；把镜头想成在和一个具体的人一对一聊天，而非做演讲。 | 画面从较近景退至半身，讲话者以手势解释，随后指向镜头；字幕强调“一对一”和“自然”。contact_02.jpg—contact_04.jpg覆盖该段。 |\n| 0:29–0:42 | 将家人或熟人作为具体想象对象，以降低面对镜头的抽象感。 | 约0:24后拿起手机，转向手机再回到镜头；屏幕上出现“我是和一个人”“这样子去对话”等示例字幕。contact_04.jpg—contact_06.jpg；差异候选 review_002.jpg—review_003.jpg。 |\n| 0:42–0:55 | 通过反复拍摄熟悉镜头；讲到重点时可加手势或身体动作。她把自身动作较多归因于此前学过舞蹈。 | 从近景回到半身，强调处举手指、拍手及展开双臂；约0:49–0:51插入跳舞练习画面，随后回到口播。contact_06.jpg—contact_08.jpg，review_003.jpg—review_004.jpg。 |\n| 0:55–1:04 | 自然基础上再加入情绪调节，进入第二阶段。 | 手指点题后短暂转换为更正面的表情和更近的构图；字幕明确切换“第二阶段”。contact_08.jpg—contact_09.jpg。 |\n| 1:04–1:26 | 开头可以按文案情境采取不同情绪；举出分享、较着急/想提醒等状态作示范。 | 口播配合胸前手势、手指与表情变化；侧身示范再转回镜头，屏幕上出现“不同文案对应不同态度”及“分享状态/劝诫状态”等提示。ASR此处有多处明显错字，具体示例以画面字幕为准。contact_09.jpg—contact_11.jpg，review_006.jpg—review_008.jpg。 |\n| 1:26–1:34 | 给出开拍前的准备办法：第一句之前先别看镜头，想象对面站着一个具体的人。 | 先以手势提示，再转向手机模拟对着人说话；字幕完整呈现“拍摄第一句之前先不要去看镜头”“想象对面站了一个人”。contact_11.jpg—contact_12.jpg；review_009.jpg—review_011.jpg。 |\n| 1:34–1:48 | 先对着想象对象说一句，再转回镜头自然表达；示例句意为“这件事情其实没有什么难的”。 | 讲话者侧脸朝手机说话，然后回看镜头；画面视角在中近景间小幅变化，字幕保留示例句。contact_12.jpg—contact_14.jpg；原始帧 frame_002701.jpg（约89.9秒）与 frame_002611.jpg（约87秒）已复核。 |\n| 1:48–1:58 | 总结开头情绪确定后，后续表达会更自然，邀请观众尝试，并以“带100个宝宝学自媒体”作结尾引导。 | 回到正面近景，手指数数、挥手，最后靠近镜头收尾；contact_14.jpg—contact_15.jpg。frame_003451.jpg（约115.2秒）复核了结尾转入招募口播。 |\n\n## 可学习的表达方法\n\n- **把抽象困难具体化：**“镜头”被替换成家人、朋友或一个具体的人，随即给出如何想象和如何转回镜头的操作步骤。\n- **用自身经历解释示范差异：**提到舞蹈经历作为自己手势较多的原因，避免将个人动作习惯说成人人都需照搬的标准。\n- **先给两阶段框架，再逐步演示：**“自然—情绪”构成易记主线，后续手势、面对熟人想象、开头情绪和转头练习均挂在对应阶段下。\n- **口播和画面同步标注要点：**大号章节字、逐句字幕、手指数目和动作示范共同强调结构；约49秒的插入舞蹈片段为个人经历提供了可见佐证。\n- **将技巧落到开头一句：**“先不看镜头—想象一个人—再转回镜头”的动作链，比只说“ .72, "end": 98.5, "text": "离婚的时候"}, {"start": 98.5, "end": 99.62, "text": "对方特徒转移财"}, {"start": 99.62, "end": 100.26, "text": "一查怎么办"}, {"start": 100.26, "end": 101.1, "text": "方东不推压"}, {"start": 101.1, "end": 101.74, "text": "新怎么办"}, {"start": 101.74, "end": 103.02, "text": "你看这种内容印出来"}, {"start": 103.02, "end": 104.02, "text": "观众马上就知道"}, {"start": 104.02, "end": 104.92, "text": "这条内容是"}, {"start": 104.92, "end": 105.78, "text": "跟我有关系的"}, {"start": 105.78, "end": 106.76, "text": "你不是在普法"}, {"start": 106.76, "end": 108.08, "text": "你现在帮他解决一个"}, {"start": 108.08, "end": 108.68, "text": "具体的问题"}, {"start": 108.68, "end": 109.62, "text": "就会非常的"}, {"start": 109.62, "end": 111.16, "text": "C新准的用户"}, {"start": 111.16, "end": 112.92, "text": "第二种就是法律支持的纠维片"}, {"start": 112.92, "end": 115.04, "text": "这我特别推荐律师去拍"}, {"start": 115.04, "end": 116.34, "text": "因为天然有提留"}, {"start": 116.34, "end": 117.24, "text": "评论会转发"}, {"start": 117.24, "end": 117.54, "text": "比如"}, {"start": 117.54, "end": 119.36, "text": "不是分去两年就自动离婚"}, {"start": 119.36, "end": 120.54, "text": "我是所有聊天记录"}, {"start": 120.54, "end": 121.7, "text": "都能当证据"}, {"start": 121.7, "end": 123.2, "text": "不是签了字的合同"}, {"start": 123.2, "end": 124.38, "text": "就一定有效"}, {"start": 124.38, "end": 125.8, "text": "我是对方先动手"}, {"start": 125.8, "end": 126.82, "text": "捏换手就没事"}, {"start": 126.82, "end": 127.7, "text": "观众会想"}, {"start": 127.7, "end": 128.6, "text": "人的不是"}, {"start": 128.6, "end": 129.12, "text": "这样"}, {"start": 129.12, "end": 130.3, "text": "那这种反常识的内容"}, {"start": 130.3, "end": 132.1, "text": "就特别的容易提流量"}, {"start": 132.1, "end": 133.1, "text": "第三种就是"}, {"start": 133.1, "end": 134.78, "text": "有主题的人受落感"}, {"start": 134.78, "end": 134.98, "text": "注意"}, {"start": 134.98, "end": 135.84, "text": "不是留水长"}, {"start": 135.84, "end": 136.8, "text": "你今天开一停写"}, {"start": 136.8, "end": 137.88, "text": "材料监科货"}, {"start": 137.88, "end": 138.96, "text": "谁关心谁会看"}, {"start": 138.96, "end": 140.14, "text": "你要加主题"}, {"start": 140.14, "end": 141.08, "text": "语如实际律师"}, {"start": 141.08, "end": 142.74, "text": "第一次独立接资讯的一天"}, {"start": 142.74, "end": 144.26, "text": "老动真意律师开停前"}, {"start": 144.26, "end": 145.26, "text": "一天都在忙什么"}, {"start": 145.26, "end": 146.96, "text": "当当时追回公司后"}, {"start": 146.96, "end": 148.18, "text": "我最真实的感受"}, {"start": 148.18, "end": 148.44, "text": "你看"}, {"start": 148.44, "end": 148.88, "text": "同样"}, {"start": 148.88, "end": 149.78, "text": "实际是日常"}, {"start": 149.78, "end": 150.86, "text": "优处金和梅主题"}, {"start": 150.86, "end": 152.28, "text": "完全是两个等下"}, {"start": 152.28, "end": 152.56, "text": "OK"}, {"start": 152.56, "end": 154.02, "text": "以上三个是我给"}, {"start": 154.02, "end": 155.5, "text": "没有暗源律师的建议"}, {"start": 155.5, "end": 157.32, "text": "如果说你已经是第二类"}, {"start": 157.32, "end": 158.02, "text": "本身有暗源"}, {"start": 158.02, "end": 158.66, "text": "有办案"}, {"start": 158.66, "end": 159.0, "text": "经验"}, {"start": 159.0, "end": 161.16, "text": "那你的内容就更好拍了"}, {"start": 161.16, "end": 162.06, "text": "也是三种"}, {"start": 162.06, "end": 163.44, "text": "第一种就是结果对面"}, {"start": 163.44, "end": 164.22, "text": "这个特别容易"}, {"start": 164.22, "end": 164.88, "text": "建立新人"}, {"start": 164.88, "end": 165.54, "text": "一个案子"}, {"start": 165.54, "end": 166.66, "text": "进入前是什么状态"}, {"start": 166.66, "end": 168.34, "text": "进入后发射了什么变化"}, {"start": 168.34, "end": 170.46, "text": "一个当时原本面临了什么问题"}, {"start": 170.46, "end": 172.74, "text": "最后结果是怎么被扭转"}, {"start": 172.74, "end": 173.06, "text": "记住"}, {"start": 173.06, "end": 174.18, "text": "不要一直说自己专业"}, {"start": 174.18, "end": 175.8, "text": "让案例去替你说话"}, {"start": 175.8, "end": 177.64, "text": "第二种就是细分理由的干活"}, {"start": 177.64, "end": 180.06, "text": "这个特别容易去做私续的转化"}, {"start": 180.06, "end": 181.54, "text": "如果说你是做婚姻家事的"}, {"start": 181.54, "end": 182.86, "text": "就持续加分分割"}, {"start": 182.86, "end": 184.22, "text": "不让全婚内赞予"}, {"start": 184.22, "end": 185.28, "text": "如果你做老动真意"}, {"start": 185.28, "end": 186.68, "text": "就 ext": "观众听得懂"}, {"start": 234.14, "end": 234.46, "text": "第二"}, {"start": 234.46, "end": 235.82, "text": "观众觉得更自由"}, {"start": 235.82, "end": 236.66, "text": "观一次三"}, {"start": 236.66, "end": 238.08, "text": "观众愿意信任你"}, {"start": 238.08, "end": 238.94, "text": "所以如果你的装号"}, {"start": 238.94, "end": 240.42, "text": "到现在还没有做起来"}, {"start": 240.42, "end": 241.32, "text": "你先回去看看"}, {"start": 241.32, "end": 242.76, "text": "你是不是还在拍那些"}, {"start": 242.76, "end": 243.76, "text": "自己觉得很专业"}, {"start": 243.76, "end": 245.38, "text": "观众确好感觉的内容"}, {"start": 245.38, "end": 247.1, "text": "把思路从我要讲什么"}, {"start": 247.1, "end": 248.48, "text": "变成一步想看什么"}, {"start": 248.48, "end": 249.82, "text": "那你的流量资讯"}, {"start": 249.82, "end": 251.56, "text": "按援级为真正开始起来"}, {"start": 251.56, "end": 252.94, "text": "如果你还是不会做的话"}, {"start": 252.94, "end": 253.88, "text": "欢迎来找我"}], "report": "# 视频复盘：7650443636907216182\n\n**发布时间：**2026-06-12 17:48（按素材 metadata；主页序位第28，实际早于6/13等后续作品）  \n**时长：**约254.3秒\n\n## 逐段主张与可见呈现\n\n| 时间 | 口播/屏幕主张 | 画面证据与表现 |\n|---|---|---|\n| 0–7秒 | 开场断言“今年适合律师起号”，继而转入学员案例。 | 单人近景坐姿，开头拍掌、举食指，连续直视镜头；字幕逐步叠加“最适合律师起号的一年”“很多律师还在靠熟人转介绍”。 |\n| 7–18秒 | 展示学员视频获得高播放/获客，以及百万博主委托的说法。 | 7–10秒短暂插入学员视频、账号列表截图和聊天截图；“精准获客1000+”“百万博主委托”为屏幕宣传信息。截图文字小且有模糊处理，无法独立核实数字、委托真实性及后续转化。 |\n| 18–35秒 | 说明本条要讲律师短视频内容取舍，并邀请关注、记笔记。 | 回到固定正面口播近景，手指计数，章节提示清晰；先以“今天免费讲清楚”建立干货承诺，再进入正文。 |\n| 35–69秒 | 先列不建议内容：法条解读、法律知识合集、工作流水账；理由是泛知识和日常若未连到普通人的具体处境，会像上课、与用户无关。 | 36秒起屏幕逐项出现红字标题，40秒后补“今天开庭做什么/见客户做什么”；主播用笔状道具指点，问题句后持续以大字字幕落结论。字幕与ASR意思一致，ASR个别词误识。 |\n| 69–85秒 | 把律师分为“尚无稳定案源”和“已有案源、想做大个人品牌”两类。 | 屏幕同步铺出两类身份，手掌分边说明；这是后面建议分流的框架，限定了受众情形。 |\n| 85–111秒 | 对第一类建议拍法律场景拆解：围绕欠薪、借款、离婚财产等观众会遇到的处境，强调解决具体问题而非泛普法。 | 88秒起顶部章节标题“法律场景的拆解”；字幕例子持续叠加，主播以张开手掌、指向镜头等手势配合。具体场景反复把法律议题转成“我会不会吃亏”。 |\n| 111–132秒 | 第二类是法律认知纠偏，举自动离婚、聊天记录作证、合同效力、先动手等常见误解，说明反常识更易引起停留/讨论。 | 屏幕标题改为“法律认知纠偏”，例句以多行字幕逐条累加；主播举指计数。法律表述只作为其创作举例，具体法律结论应另行核实。 |\n| 132–160秒 | 第三类是有主题的人设 vlog，不是流水账；实习律师首次独立接咨询、劳动争议开庭前忙碌、追回工资后的真实感受等都可成为主题。 | “有主题的人设vlog”章节持续显示，三个例子逐步铺在画面下半部；随后切回她的  {"start": 101.2, "end": 103.6, "text": "一上来就想靠几条视频掌奋"}, {"start": 103.6, "end": 104.44, "text": "爆款变现"}, {"start": 104.44, "end": 105.54, "text": "你越这么想越容易奔"}, {"start": 105.54, "end": 107.68, "text": "因为这些结果里你太远了"}, {"start": 107.68, "end": 109.02, "text": "当你每天看不到变化的时候"}, {"start": 109.02, "end": 110.28, "text": "大脑就会自动觉得"}, {"start": 110.28, "end": 112.02, "text": "这件事情没有希望"}, {"start": 112.02, "end": 113.26, "text": "所以你一定要学会说"}, {"start": 113.26, "end": 115.44, "text": "把大幕标拆解成小避缓"}, {"start": 115.44, "end": 116.42, "text": "你不要想说"}, {"start": 116.42, "end": 117.96, "text": "我要把他帐号坐起来"}, {"start": 117.96, "end": 119.26, "text": "你改成我今天先发一条"}, {"start": 119.26, "end": 120.16, "text": "你也不要说"}, {"start": 120.16, "end": 122.12, "text": "我要学会做自媒体"}, {"start": 122.12, "end": 123.46, "text": "啊 你要改成"}, {"start": 123.46, "end": 125.88, "text": "我今天先复盘一条同行的爆款"}, {"start": 125.88, "end": 127.76, "text": "拆他的开头结构和评论"}, {"start": 127.76, "end": 128.22, "text": "去对吧"}, {"start": 128.22, "end": 129.52, "text": "这些动作看起来很小"}, {"start": 129.52, "end": 130.64, "text": "但他们会给一种"}, {"start": 131.1, "end": 133.12, "text": "非常杀势实在的"}, {"start": 133.12, "end": 134.04, "text": "这种推进感"}, {"start": 134.04, "end": 134.42, "text": "这样的话"}, {"start": 134.42, "end": 136.1, "text": "你就终于不是在空能流量了"}, {"start": 136.1, "end": 139.4, "text": "而是在明确的完成一件件能让账号变好的事情"}, {"start": 139.4, "end": 140.7, "text": "就有经常的学院说"}, {"start": 140.7, "end": 142.04, "text": "我能帮你走结计"}, {"start": 142.04, "end": 144.82, "text": "但是我不能帮你跳过积累"}, {"start": 144.82, "end": 145.92, "text": "这就是为什么我的陪跑"}, {"start": 145.92, "end": 147.16, "text": "都是阶段性的"}, {"start": 147.16, "end": 147.94, "text": "每个阶段"}, {"start": 147.94, "end": 150.24, "text": "这么一点点去进阶的扎实走温"}, {"start": 150.24, "end": 151.36, "text": "这三个就是生存改变"}, {"start": 151.36, "end": 153.16, "text": "就有很多人嘴上说想不自媒体"}, {"start": 153.16, "end": 155.34, "text": "但心里根本没有把自己当成一个创作者"}, {"start": 155.34, "end": 156.12, "text": "他说的是"}, {"start": 156.12, "end": 157.8, "text": "我要坚持更新"}, {"start": 157.8, "end": 159.0, "text": "你听这句话"}, {"start": 159.0, "end": 160.66, "text": "背后就是对抗"}, {"start": 160.66, "end": 163.16, "text": "好像更新他是一件很痛苦的事情"}, {"start": 163.16, "end": 164.66, "text": "我必须逼着自己做"}, {"start": 164.66, "end": 165.96, "text": "但你要把它换成说"}, {"start": 165.96, "end": 167.92, "text": "我是一个持续叔叔观念的人"}, {"start": 167.92, "end": 169.96, "text": "我是一个正在训练表达的人"}, {"start": 169.96, "end": 172.46, "text": "我是一个正在用内容积累信任的人"}, {"start": 172.46, "end": 175.6, "text": "我是一个正在把自己变成可成交资产的人"}, {"start": 175.6, "end": 177.76, "text": "身份以面动作就变了"}, {"start": 177.76, "end": 179.62, "text": "你发内容不再是为了完成"}, {"start": 179.62, "end": 181.42, "text": "任务也不是在逃耗平台"}, {"start": 181.42, "end": 183.38, "text": "你是在资亚自己投资自己"}, {"start": 183.38, "end": 183.94, "text": "当然啊"}, {"start": 183.94, "end": 185.88, "text": "这个也是我自己给自己洗脑的过程"}, {"start": 186.33999999999997, "end": 187.62, "text": "不好意思 进来说一声"}, {"start": 187.62, "end": 188.04, "text": "大声"}, {"start": 188.04, "end": 188.84, "text": "但真的"}, {"start": 188.84, "end": 190.54, "text": "就是一旦一样的这种思维"}, {"start": 190.54, "end": 192.32, "text": "不管你今天有没有点赞收藏"}, {"start": 192.32, "end": 194.02, "text": "也不管你播放量是不是久纪"}, {"start": 194.02, "end": 196.3, "text": "是你都不会被轻易的打垮"}, {"start": 196.3, "end": 198.96, "text": "因为你知道你不是再等一条爆款来救你"}, {"start": 198.96, "end": 200.26, "text": "你是在用持续的更新"}, {"start": 200.26, "end": 202.44, "text": "把自己训练成一个真正懂内容"}, {"start": 202.44, "end": 204.24, "text": "会创作能做起来的人"}], "report": "# 7650900395115564303｜如何在无反馈期坚持做事、保持执行密度\n\n**实际发布时间：**2026-06-13 23:21（元数据）；视频约204.4秒。主页排位27，真实发布时间早于排位26（6月18日）五天，卡片顺序不可当作时间顺序。\n\n## 时间线与可见依据\n\n- **0–8秒｜提出反直觉问题。**画面是夜间室内/阳台附近的坐姿自拍，创作者穿灰色上衣、戴眼镜，手持带毛套的小麦克风，字幕问没有正反馈时如何保持执行。她整理头发后以手势分段，背景可见暗窗、栏杆灯点和暖色灯。\n- **8–19秒｜把“没反馈”具体化。**字幕和口播式屏幕文字列出发视频却无点赞、收藏的情形，并提示创作者因此泄气、怀疑自己。她向前做开放手势，镜头保持近景；这一段先让目标观众识别处境，再进入方法。\n- **19–41秒｜拆成外部与内部反馈。**她举两指，字幕把反馈分为平台数据/粉丝点赞等外部信号，以及由自己给予自己的内部反馈。约28–32秒画面短暂插入主页/作品列表截图，随后回到创作者；小字无法完整辨读，不据此推断具体账号表现。\n- **41–76秒｜先讲减少外部反馈依赖。**画面上方出 88, "end": 67.1, "text": "这就是我说的自媒体空心人"}, {"start": 67.1, "end": 68.22, "text": "账号看伞很热闹"}, {"start": 68.22, "end": 69.58, "text": "但人是空的"}, {"start": 69.58, "end": 71.68, "text": "当然我不是说这种账号一点能力都没有"}, {"start": 71.68, "end": 72.32, "text": "恰恰相反"}, {"start": 72.32, "end": 74.0, "text": "他已经卖进了自媒体的大门"}, {"start": 74.0, "end": 75.52, "text": "至少做有样的能力"}, {"start": 75.52, "end": 76.9, "text": "他是被市场验证过的"}, {"start": 76.9, "end": 79.58, "text": "但问题是这种账号也是最容易被淘汰的"}, {"start": 79.58, "end": 81.5, "text": "因为现在AI越来越多了之后"}, {"start": 81.5, "end": 83.06, "text": "统一用什么抱款公式"}, {"start": 83.06, "end": 85.24, "text": "搞出整齐华依的这种巨式"}, {"start": 85.24, "end": 87.82, "text": "你是看不到他的情绪起伏"}, {"start": 87.82, "end": 90.36, "text": "甚至还有一些就是单纯的独搞机器"}, {"start": 90.36, "end": 92.52, "text": "这也是为什么现在在真诚活任感的"}, {"start": 92.52, "end": 93.58, "text": "一批游戚可贵"}, {"start": 93.58, "end": 95.82, "text": "还有最近很火的什么日跟一百条"}, {"start": 95.82, "end": 97.54, "text": "我不是想吐槽努力这件事情"}, {"start": 97.54, "end": 100.62, "text": "但如果一百条都是那种犯法而谈"}, {"start": 100.62, "end": 101.9, "text": "像个小丑一样"}, {"start": 101.9, "end": 102.92, "text": "没有观点密度"}, {"start": 102.92, "end": 103.72, "text": "真实经验"}, {"start": 103.72, "end": 105.32, "text": "包括没有解决发案的东西"}, {"start": 105.32, "end": 107.16, "text": "我真的会觉得你不是在做内容"}, {"start": 107.16, "end": 108.36, "text": "你是在制造垃圾"}, {"start": 108.36, "end": 109.82, "text": "空心的内容发的越多"}, {"start": 109.82, "end": 112.2, "text": "只会越快地透支你的个人性人感"}, {"start": 112.2, "end": 113.76, "text": "还有一种更危险的空心"}, {"start": 113.76, "end": 115.1, "text": "就是商业接不住"}, {"start": 115.1, "end": 115.76, "text": "有量来了"}, {"start": 115.76, "end": 117.14, "text": "但又不知道为什么要找你"}, {"start": 117.14, "end": 117.8, "text": "他可能觉得"}, {"start": 117.8, "end": 119.38, "text": "你某条视频说得很爽"}, {"start": 119.38, "end": 120.48, "text": "某句话挺扎心"}, {"start": 120.48, "end": 121.7, "text": "某个观点很正确"}, {"start": 121.7, "end": 123.24, "text": "但是他不会为你付费"}, {"start": 123.24, "end": 123.68, "text": "为什么"}, {"start": 123.68, "end": 125.66, "text": "因为你没有清晰的问题解决能力"}, {"start": 125.66, "end": 126.38, "text": "你没有案例"}, {"start": 126.38, "end": 128.12, "text": "没有方法跟没有产品去沉浸"}, {"start": 128.12, "end": 130.22, "text": "也没有让用户相信你的理由"}, {"start": 130.22, "end": 132.6, "text": "所以空心人账号的最大问题"}, {"start": 132.6, "end": 133.52, "text": "不是没有流量"}, {"start": 133.52, "end": 134.64, "text": "而是有了流量"}, {"start": 134.64, "end": 136.06, "text": "你也变不沉信任"}, {"start": 136.06, "end": 138.06, "text": "有了曝光也变不了沉浆"}, {"start": 138.06, "end": 139.38, "text": "所以你看我的陪炮给学院"}, {"start": 139.38, "end": 140.34, "text": "做一位一的手艺"}, {"start": 140.34, "end": 141.7, "text": "一定是积律他的真实经济"}, {"start": 141.7, "end": 143.06, "text": "去支撑他的观点"}, {"start": 143.06, "end": 145.44, "text": "引导他去做属于他自己的表达"}, {"start": 145.44, "end": 147.3, "text": "情绪判断和一些世界"}, {"start": 147.3, "end": 149.48, "text": "所以我的学院每一个都是独一五二的"}, {"start": 149.48, "end": 150.88, "text": "未来最先被淘汰的不是"}, {"start": 150.88, "end": 151.96, "text": "不会发内容的人"}, {"start": 151.96, "end": 153.26, "text": "而是会发内容"}, {"start": 153.26, "end": 155.48, "text": "但这个内容里面没有你自己"}], "report": "# 7654151382865415487｜看完向佐访谈，比没流量更可怕的是“空心人”\n\n**实际发布时间：**2026-06-22 17:36（元数据）；时长约155.6秒。此处“21–40”按主页卡片顺序编号，不代表时间新旧。本片排位25，实际晚于6月18日的下一条卡片作品。\n\n## 时间线与论据\n\n- **0–8秒｜断言与引子。**字幕提出“自媒体第一批淘汰的会是空心人”，随后出示电脑上播放的访谈画面。镜头为桌前近景，创作者戴黑框眼镜、面对镜头，手在桌面/笔记本旁活动；笔记本成为后续论据的视觉道具。\n- **8–39秒｜把公共人物从标签还原为细节。**她指向电脑中访谈片段，字幕将旧有抽象标签与这次长访谈的生活、家庭描述作对照，推进“有具体细节，人就不只剩标签”的解释。约16秒起电脑画面嵌入橙色帽子受访者、主持人和双人访谈等多个景别，论据画面紧跟叙述，不是只口头提名。\n- **39–67秒｜转到创作者账号。**画面回到固定口播近景，字幕列出用户点进账号仍不清楚“是谁、凭什么说、经历过什么、能解决什么、与同类差别在哪”等问题。说到“空心”时她手贴胸前、另一手指点，字幕将抽象判断拆成可检验的个人经历与专业依据。\n- **67–93秒｜区分会做内容与有人格。**本段保持单人正面镜头，手势由胸前指向外侧，再以手指强调AI与爆款公式。她承认这类账号可能已有内容能力和市场验证，但提出模板化之后难以呈现个人经验和情绪线索；字幕与口播线索大体吻合，ASR中少数字词（如比例、名词）识别混乱，故不采信具体百分数。\n- **93–112秒｜以“日更100条”为例。**近景不变，创作者以手势强调数量与内容质量的区别。她并非反对勤奋，而是批评重复、泛泛、缺观点密度/经验/解决方案的堆量，认为反复发布空泛内容会消耗信任。字幕可辨这些并列条件；没有用标题中的夸张措辞作为额外证据。\n- **112–138秒｜从曝光到信任的落差。**她把手贴近胸前并多次竖指，逐项列出商业承接要素：明确问题解决能力、案例、方法、产品，以及让用户信任的理由。逻辑从“有流量”转至“能不能承接”，本段论点连续，未借用其他视频的结构或材料。\n- **138–155秒｜服务定位与结论。**屏幕插入学员聊天/内容页及电脑上的课程/账号材料，细字较小，不据此确认个案成效；字幕称一对一陪跑基于学员真实经历，支持其形成自己的表达与判断。结尾回到创作者近景，她举起一根手指，把淘汰风险落在“会发内容但内容里没有自己”。\n\n## 可学习的表达与局限\n\n可借鉴的是先用外部访谈作可视化例子，再把“具体细节”转成账号自检问题，随后用内容数量和商业承接两个反例扩大论证，最后给出陪跑服务的工作方向。画面持续以近景为主，但笔记本访谈插片、双人访谈和末段学员材料，为抽象话题提供证据层次；胸前手势、列点手势和竖指强调帮助观众辨别段落转折。单条片子主要是观点论证与服务展示，不能据此验证所举市场判断或学员转化结果。末段截图需放大原始帧才能核准文字。\n\n## 与相邻作品的时间关系（候选）\n\n主页相邻的#26发表于2026-06-18 12:00，早于本片四天，属于美图影像节工具体验Vlog。两条内容类型明显不同：#26以现场活动/工具为主，#25是棚内桌前的创作者观点口播。可以作为账号内容形态的题材差异候选，现有材料不足以判断为策略转向或连续系列。\n\n## 原帧复核清单\n\n机械扫描覆盖源视频4667帧（frame_scan）；语义视觉检查为2fps完整时间线联系表20页及review_sheets候选联系表15页，覆盖0.0–155.5秒；并在候选变化点核对对应原帧，重点建议主代理复核约6–8秒访谈标题/人物、16–34秒访谈插片字幕、138–148秒学员材料小字。未对全部4667张原帧逐张作语义判读。ASR词级转录已按全段阅读并与可见字幕/画面互校；识别文本存在明显错词。未发现独立OCR结果；未听取音频，报告不评价音色、语调或配乐。\n", "ocr": "本条没有独立OCR时间线。烧录字幕仍在完整视频中。", "media": {"id": "7654151382865415487", "publication_time": "2026-06-22 17:36", "pinned": false, "title": "看完向佐访谈，比没流量更可怕的是“空心人” 做自媒体，未来第一批被淘汰的一定是“空心人”博主#新人博主 #自媒体创业 #个人IP #自媒体干货分享 #向佐", "public_url": "https://www.douyin.com/video/7654151382865415487", "file": "videos/7654151382865415487.mp4", "mode": "av1_480_crf42", "source_bytes": 31936305, "package_bytes": 10694770, "source_video": {"codec_name": "h264", "width": 1080, "height": 1920, "r_frame_rate": "30/1", "nb_frames": "4667", "duration": "155.566667"}, "package_video": {"codec_name": "av1", "width": 480, "height": 854, "r_frame_rate": "30/1", "nb_frames": "4667", "duration": "155.566667"}, "package_audio": {"codec_name": "aac", "channels": 1, "sample_rate": "44100", "duration": "155.598005"}, "full_decode_pass": true, "frame_count_match": true, "sha256": "fc76a0d0a42c54bf838b4d57cf42713168344166021679659cd22fcb83ecafae", "elapsed_seconds": 69.54}}, {"id": "7657972841173798153", "publication_time": "2026-07-03 00:45", "title": "讲真，教培行业真的是冰两重天 建议所有没生源的老师尽早转型，越是没生源越要做自媒体#自媒体创业 #个人IP #新人博主 #自媒体运营 #教师IP", "pinned": false, "public_url": "https://www.douyin.com/video/7657972841173798153", "segments": [{"start": 0.0, "end": 2.0, "text": "他们约在厂杀误明行说出差啊"}, {"start": 2.0, "end": 3.44, "text": "和不同礼物的老师们去分享"}, {"start": 3.44, "end": 5.32, "text": "交配IP怎么从民道一打造"}, {"start": 5.32, "end": 6.28, "text": "有优势机构老师"}, {"start": 6.28, "end": 6.92, "text": "约二运圆账"}, {"start": 6.92, "end": 8.24, "text": "独立音乐老师等等"}, {"start": 8.24, "end": 9.56, "text": "他们就跟我说啊"}, {"start": 9.56, "end": 11.0, "text": "大家都经历过教练行业"}, {"start": 11.0, "end": 12.56, "text": "最一定一生的时候"}, {"start": 12.56, "end": 14.280000000000001, "text": "大概是2011几年的说吧"}, {"start": 14.280000000000001, "end": 15.64, "text": "学生都是送上本来的"}, {"start": 15.64, "end": 16.76, "text": "根本不充美有圣愿"}, {"start": 16.76, "end": 18.400000000000002, "text": "但现在其实数量基本上是"}, {"start": 18.400000000000002, "end": 19.2, "text": "对押是下这样"}, {"start": 19.2, "end": 21.04, "text": "大概少了50%吧"}, {"start": 21.04, "end": 22.44, "text": "以前一号老呆新的这种"}, {"start": 22.44, "end": 23.2, "text": "招生方式"}, {"start": 23.2, "end": 24.400000000000002, "text": "现在基本上不管用了"}, {"start": 24.400000000000002, "end": 25.080000000000002, "text": "为什么"}, {"start": 25.32, "end": 26.16, "text": "特别有意思"}, {"start": 26.16, "end": 27.64, "text": "因为90后00后的加上"}, {"start": 27.64, "end": 28.32, "text": "他们觉得"}, {"start": 28.44, "end": 30.16, "text": "孩子老师好容易发现一个"}, {"start": 30.16, "end": 31.080000000000002, "text": "宝丛老师"}, {"start": 31.080000000000002, "end": 33.68, "text": "是不愿意和其他人共享"}, {"start": 33.68, "end": 35.32, "text": "这种心理其实让整个"}, {"start": 35.32, "end": 37.16, "text": "交配行业更加血胸加霜"}, {"start": 37.16, "end": 38.4, "text": "我聊了好几个老师"}, {"start": 38.4, "end": 40.4, "text": "有些人可能半年都数不到一个学生"}, {"start": 40.4, "end": 42.0, "text": "有些人之前有六个学生"}, {"start": 42.0, "end": 44.760000000000005, "text": "跑完几之后以一个同朋友了"}, {"start": 44.760000000000005, "end": 46.04, "text": "甚至有老师限职"}, {"start": 46.04, "end": 46.68, "text": "兼职"}, {"start": 46.68, "end": 49.16, "text": "他说兼职法而现在是最轻松的"}, {"start": 49.16, "end": 51.56, "text": "因为招生的压力全在牢板"}, {"start": 51.56, "end": 53.16, "text": "那还有一个约二运圆账"}, 999, "end": 110.0, "text": "而是把他身上最真实的"}, {"start": 110.0, "end": 111.0, "text": "最有价值的部分"}, {"start": 111.0, "end": 112.44, "text": "给体验出来"}, {"start": 112.44, "end": 113.84, "text": "他们只会交情的老师"}, {"start": 113.84, "end": 115.56, "text": "他是一个真正董教育董海"}, {"start": 115.56, "end": 117.32, "text": "接董家长教育的刚亲老师"}, {"start": 117.32, "end": 119.27999999999999, "text": "于是我们就委让他的教育理念"}, {"start": 119.27999999999999, "end": 121.55999999999999, "text": "真是客堂学生上护士去做内容"}, {"start": 121.55999999999999, "end": 122.6, "text": "结果你看怎么样"}, {"start": 122.6, "end": 123.6, "text": "调整方向"}, {"start": 123.6, "end": 126.08, "text": "然后他单约就精准掌门三千家"}, {"start": 126.08, "end": 127.03999999999999, "text": "接链产生说好"}, {"start": 127.03999999999999, "end": 129.88, "text": "尽调视食物案家的播放爆款食品"}, {"start": 129.88, "end": 132.68, "text": "重要的是他现象门店的课程值劲"}, {"start": 132.68, "end": 133.92, "text": "愚悦爆满"}, {"start": 133.92, "end": 136.92, "text": "每天他都是在忙着做精准家长的服务和转化"}, {"start": 136.92, "end": 139.72, "text": "失愿多到实体工作是根本接不过来了"}, {"start": 139.72, "end": 140.6, "text": "但你知道吗"}, {"start": 140.6, "end": 143.07999999999998, "text": "这还不是最厉害的地方"}, {"start": 143.07999999999998, "end": 144.07999999999998, "text": "因为你想想"}, {"start": 144.07999999999998, "end": 144.79999999999998, "text": "现象的教师"}, {"start": 144.79999999999998, "end": 145.84, "text": "他的容量是有限的"}, {"start": 145.84, "end": 146.95999999999998, "text": "再怎么满意到头的"}, {"start": 147.36, "end": 149.6, "text": "所以他现在已经开始路线上课程了"}, {"start": 149.6, "end": 152.8, "text": "也就是说从原来只做线下的这种教学"}, {"start": 152.8, "end": 155.68, "text": "直接升级为线下教学加线上网课"}, {"start": 155.68, "end": 156.84, "text": "两条腿一起赚钱"}, {"start": 156.84, "end": 158.0, "text": "我觉得这才是教佩老师"}, {"start": 158.0, "end": 159.20000000000002, "text": "真是一个看了几回"}, {"start": 159.20000000000002, "end": 160.20000000000002, "text": "实在变了"}, {"start": 160.20000000000002, "end": 162.24, "text": "好老师真的不用再傻小等着老学"}, {"start": 162.24, "end": 163.24, "text": "来接受新学院"}, {"start": 163.24, "end": 164.6400000000000 头\n\n发布时间：2026-07-10 15:34（metadata.json；置顶状态不用于推断近期）。时长约133.7秒。依据本地视频生成的17页2fps联系表（contact_01–17）、本地ASR词级时间戳及metadata；全部4011帧留存，但本次并未逐帧人工查看。无独立OCR文件，字幕以联系表上可见烧录字校准ASR。方法为全帧机械扫描/存档 + 2fps视觉初读；本条没有差异候选复核页。未听取音轨，不能评价音色、配乐或语调。\n\n## 时间线与结构\n\n- **00:00–00:08｜先给“奔现”现场钩子。** 快切活动背景板合影、教室学员、车内补妆和多人自拍，字幕把“线下奔现”与“场面上头”连起来。镜头先用群体和创作者本人建立这是一次真实聚会，随后补入正在听课的学员，画面题材切换快但仍围绕“线上认识的人见面”。\n- **00:08–00:23｜从出发和布场交代事件。** 出现投影讲台、活动地点字卡、镜前化妆、收拾包、车窗外道路，再切回活动场地和设备调试。字幕说明活动下午开始、提前到场检查设备；以准备过程把Vlog从结果照片扩展成事件过程。可辨活动背景板上“超跑文化·AI自媒体内部闭门赋能会”等字样，细小背景字不作过度解读。\n- **00:23–00:39｜把陌生名单变成现场人物。** 画面从创作者看手机切到到场学员、走廊相遇和彼此交谈，字幕讲有人从外地赶来、把名单上的名字与真实面孔对应。近景自拍与他人互动镜头交替，亲近感主要来自具体到场行为和人物反应，不靠解释抽象“社群价值”。\n- **00:39–00:51｜用第一次见面的反差制造熟悉感。** 学员坐席、合影和创作者与来访者聊天交替，字幕描述原本第一次见面，却会提起收藏过的内容、像网友约饭。这个段落给“奔现”提供可见依据：认出对方、打招呼、一起合照；ASR在此段误识较多，语义以联系表烧录字幕为准。\n- **00:51–01:03｜从社交转入课程现场。** 先有创作者台上讲解、学员听讲和案例画面，再以“分享会/思维碰撞”类字幕概括现场。画面不是完整记录讲课内容，而用讲者、屏幕、学员笔记及反应作摘要，信息重点仍是现场氛围。\n- **01:03–01:20｜用分享者和屏幕内容证明活动有实质。** 大屏讲解、现场拍屏、学员低头记笔记、另一位讲者演示AI/剪辑相关内容交替呈现。字幕强调案例拆解、获客与从零到一的操作过程；具体屏幕小字较细，需原帧复核内容准确度。学员拍摄、记笔记是“内容被认真接收”的可见反应，但不能单凭镜头证明效果。\n- **01:20–01:40｜呈现学员投入与即时交流。** 多个连续镜头留在座位区：有人拍PPT、在电脑上操作、转头和旁边人讨论，也有台上演示和全场视角。剪辑把字幕中的“兴奋/有收获”落到可见的手机、笔记本和交谈动作；少数面部表情只是瞬间，不宜当作所有观众的统一感受。\n- **01:40–02:00｜解释价值来自可操作经验。** 镜头在学员与台上屏幕之间切换，再出现创作者讲解、听众拍摄及投影案例。字幕把分享定位为自己从零实践、产生结果后才拿出来讲；这是创作者对内容来源的自述，画面能证明有分享与听众记录，不能独立核验案例成效。\n- **02:00–02:14｜自由交流与情绪落点。** 镜头转至散场交流、学员合照、多人站台前，以及夜间围桌吃饭碰杯。画面由白天课堂转为晚上聚餐，字幕由数字指标转到人与人相处、彼此鼓励，形成从“学到什么”到“为什么记得这群人”的收尾。末尾以大合影和活动背景板回环，完整收束当天记录。\n\n## 可学习点与局限\n\n这条适合参考的是事件型内容的覆盖清单：开场给最有识别度的群像；中段按“出发—布场—到场—分享—交流”交代过程；讲课时用讲者、屏幕、听众反应穿插，避免整条只剩讲话者单一机位；结尾用聚餐和合照给情绪落点。创作者反复以自拍近景作叙事锚点，其他镜头则提供环境、流程和人物关系，观众容易跟上“我在哪里、发生什么”。字幕承担时间和主题提示，地点/活动背景板提供少量现场信息。\n\n限制在于它是纪实回顾，不是系统教学：屏幕案例没有足够停留让观众复现步骤，字幕里关于获客、变现的判断属于作者陈述；活动中大量学员镜头也不能代表全部参与者。画面场景切换密集，部分转场靠短促素材，主题从活动记录延伸到自媒体方法再转向情感收尾，若要仿拍，应先选一个主叙事目标并给关键信息更长展示时间。音轨未作主观评价。\n\n## 与相邻作品的关系候选\n\n在本次责任范围内，发布时间上本条晚于7月8日字体教程、与同日另一条口播相差不足一小时。相较工具建议和状态表达，本条转向活动现场与社群氛围，较稳妥地看作题材补充；仅凭这三条不能断定明确系列或发展阶段变化。\n\n## 原帧复核清单\n\n本次查看全部17页：contact_0 询/小产品。若有实体产品，作者称一千名精准粉就可能带来客户或订单；这是一般化推断，没有提供具体案例、行业或转化数据。\n- **00:24–00:35｜回到阶段任务。** 从只发内容转向理解哪些题材带来流量、怎样触达并服务一群人；视频仍以增长阶梯为框架，不展开发布频率或账号定位的操作步骤。\n- **00:36–00:47｜第二节点：5000粉。** 她把五千粉定义成容易卡住、但有机会从偶尔做对，过渡到知道如何持续做对的阶段。强调坚持发布可继续靠近一万；偶尔一两条爆发不足以说明已掌握稳定增长。\n- **约00:48–01:10｜从偶然到可重复。** 以“灵感枯竭/后面不知道发什么”作为五千粉阶段的瓶颈，提出要有重复使用的内容方法，稳定找到选题、吸引同一群人，并把流量转成粉丝、客户与收入。作者说五千粉是从偶尔做对走向知道如何持续做对的节点；没有演示具体选题模板。\n- **约01:11–02:05｜第三节点：10000粉。** 一万粉不是“从此躺平”或收入保证，而是作者认为创作者已对自媒体形成自己的理解：知道什么内容带来流量、建立信任、促成转化。接着按博主接商单、带货者识别适合粉丝的产品、知识付费/实体服务靠内容获客等不同路径举例，并称此时账号开始成为可重复使用的IP资产与信任。单条未爆或平台流量波动时，也更知道如何接住流量。\n- **约02:05–02:23｜纠正粉丝量迷思并收束。** 几百粉也可能赚钱，一万粉也不代表一定能稳定变现。关键在于让内容、涨粉与商业逐步跑通，而非把门槛数字当结果保证；片尾再收回三阶段框架并导向关注。\n\n## 表现与可学习点\n\n全片为正面近景口播，背景有暖色灯光；手指与字幕卡分别标出1000、5000、10000三档，数字级别在视觉上形成清晰路标。主要结构是“节点定义—阶段心理/任务—下一级变化”，并在结束时收回到“粉丝数不是收入保证”，这项限定有助于降低标题里的增长承诺感。可借鉴的是用阶段差异组织建议；要进一步增强可操作性，需要补充每阶段的验证指标、典型内容样例和不同业务的分支。\n\n## 局限与适用场景\n\n适用于给新手建立预期、解释从偶发增长到稳定内容生产的差别。三个阈值是作者的经验框架而非平台规则；视频没有说明为什么是1000/5000/10000，也没有证明这些数字与具体变现能力存在普遍对应关系。做实体/高客单服务者不应把粉丝量当作唯一目标，文中“精准粉能带单”同样需要真实转化数据支持。\n\n## 时间线关系候选\n\n7月21日。与随后7月25日“高客单账号三种内容”存在可能的**补充关系**：本条以粉丝阶段划分成长任务，后条进一步谈破冰、筛选和成交证据；目前只宜视为主题邻近，不能认定作者有意编成连续系列。与7月28日短板人格化视频则题材相关、切口不同。\n\n## 证据与复核\n\n查看了 `sheets/contact_01–18.jpg` 全部18页（2fps时间线联系表）；本轮逐页打开原始联系表，核验数字节点和字幕随时间的变化。查看 `metadata.json` 与新到的 `asr.json`。ASR错字较多，但“1000/5000/10000”三个节点、不同阶段任务以及粉丝数不等于稳定变现的限定，均与联系表可辨字幕一致；具体产品词以画面字幕校正。未见 `subtitle_timeline.md`，未声称听过完整音轨。原视频4285帧保留。联系表不是逐帧语义分析。已完成联系表与ASR的关键节点互证；尚未完成frame_scan候选的原帧人工核查，主代理可优先检查约00:10–00:24一千粉机会/实体产品说法、00:36–01:10五千粉增长系统，以及01:11–02:05不同业务路径与一万粉/变现限定。`frame_scan` 仅能协助找画面变化，不证明观点。\n\n", "ocr": "本条没有独立OCR时间线。烧录字幕仍在完整视频中。", "media": {"id": "7664937363994414372", "publication_time": "2026-07-21 19:11", "pinned": false, "title": "从0-10000粉，自媒体变现必经的3个节点 #自媒体创业 #个人IP #新人博主 #短视频运营 #自媒体运营", "public_url": "https://www.douyin.com/video/7664937363994414372", "file": "videos/7664937363994414372.mp4", "mode": "av1_480_crf42", "source_bytes": 17344025, "package_bytes": 7992130, "source_video": 七天”属于经验建议，未比较其他周期。\n- **01:36–02:01｜方法二：发给朋友前先观察自己的反应。** 重点不是让朋友代替判断，而是留意自己期待夸奖还是心里没底；后者可能提示作者自己也察觉内容未过关，却因把作品当“宝宝”而不愿删改。这里把情绪当诊断信号，易懂但不构成对稿件质量的客观检验；也需避免把寻求反馈简化为单一情绪测试。\n- **02:01–02:19｜方法三：复盘数据时把作品当普通案例。** 不把高数据视作努力应得的回报，尝试从题材、开头、完播等维度观察，并展示/提及数据分析报告与AI建议。联系表约02:20后可见报告截图叠在讲者画面上，是本片主要视觉插入；截图文字较小，样本不足以判断信息是否能在手机屏幕读清。\n- **02:19–02:49｜强调从数据到调整，不陷在情绪里。** 建议抽离“这是我的作品”的身份，找出问题后直接改进；把每次发布视为学习过程。结论与前面三种方法闭合，但将数据复盘归因于进步仍是创作者建议，未展示具体案例前后结果。\n- **02:49–02:50｜简短收束。** 以“去练”式号召结束。\n\n## 表现与判断\n\n主张是用第三者视角减少创作者自我补全逻辑、情绪依附和数据焦虑；三项做法分别作用于发布前后与数据复盘。可学习的表达是“提出问题—解释为何看不见—编号给方法—回扣收益”，并用手势和画面角落数字提示第三项；主体基本维持桌前直面镜头，关键短语用黄字强调，约02:20的数据报告截图形成信息层级变化。局限在于没有完整展示一次改稿或数据复盘案例，也未给出指标口径和适用边界；学员效果、AI报告有效性不可由本条验证。\n\n时间线比较候选：本条发布于8月31日，早于9月2日谈整体镜头呈现、9月22日谈活人感及9月29日镜头交流感的条目。它可以作为“创作者如何评估自己内容”的底层方法，与后续呈现技巧题材不同；二者是否构成账号有意设计的连续课程，现有证据不足，标为题材相邻候选而非确定延续。\n\n复核：本次逐一看过contact_01–22；全帧frame_scan候选复核：否（留待主代理）。建议优先抽查00:56–01:36冷却法论据、01:36–02:19情绪与数据方法分界、02:20附近截图出现/退出和约02:49收尾。原始5091帧已保留；2fps联系表是时间线抽样，不能代表逐帧语义检查。\n", "ocr": "本条没有独立OCR时间线。烧录字幕仍在完整视频中。", "media": {"id": "7680178520898719022", "publication_time": "2026-08-31 20:55", "pinned": false, "title": "做自媒体，一定要刻意培养“第三视角”！！ #个人IP #自媒体创业 #新人博主 #短视频运营 #自媒体运营", "public_url": "https://www.douyin.com/video/7680178520898719022", "file": "videos/7680178520898719022.mp4", "mode": "av1_480_crf42", "source_bytes": 26032738, "package_bytes": 9214919, "source_video": {"codec_name": "h264", "width": 1080, "height": 1920, "r_frame_rate": "30/1", "nb_frames": "5091", "duration": "169.700000"}, "package_video": {"codec_name": "av1", "width": 480, "height": 854, "r_frame_rate": "30/1", "nb_frames": "5091", "duration": "169.700000"}, "package_audio": {"codec_name": "aac", "channels": 1, "sample_rate": "44100", "duration": "169.716009"}, "full_decode_pass": true, "frame_count_match": true, "sha256": "d27fed589539d4f21fa74248c918f28a13b8fdcd243b22b64bcc82aae43f4dcd", "elapsed_seconds": 113.82}}, {"id": "7680798672723922203", "publication_time": "2026-09-02 13:01", "title": "做 "把我用上自媒体赶紧关注我吧"}], "report": "# 7682035066289114378｜拍视频紧张、卡壳、忘词的四个误区\n\n发布时间：2026-09-05 20:59（metadata.json）；时长约181秒。依据本地ASR转录及23张2fps联系表（contact_01–23，已全部查看）。ASR有大量同音错识；四个误区的次序与主张和联系表可见字幕互相印证，细节以清晰字幕和上下文校正，未把ASR错词照录。无OCR时间线。画面为持续口播，约00:00出现过往镜头中的本人小窗，后段持手机示范提词器并插入往期封面。\n\n## 时间线与结构\n\n- **00:00–00:20｜用自身经历建立问题与承诺。** 以“如果你也像我刚开始一样”切入镜头紧张、卡壳和忘词，说明常见问题未必是口才，而是对镜头不熟，预告四个误区。右上角短暂放入旧视频中的本人，作为经历佐证；它能说明内容创作者自述经历，不能独立验证普遍性。\n- **00:20–00:48｜误区一：要求一次完美。** 反对一镜到底、逐字背熟，建议说错重来后期剪辑，不必把稿子每句都背成固定文本。用自己曾反复重拍、卡住的经历做反例。内容结构清楚，转变为允许修正；但新手若直接放任即兴，也仍可能偏离重点。\n- **00:48–01:21｜误区二：过度关注外在条件。** 指出拍摄前反复纠结妆容、衣服、灯光、背景，可能让人状态紧绷；强调先传递能量与真诚分享，把拍视频看作日常交流。聊天/过往内容画面和手持手机做视觉辅助。主张强调“先开拍”，但场景、灯光对清晰度的基础作用没有细分。\n- **01:21–01:36｜将标准从外貌拉回可理解与真实。** 进一步说普通创作者不必先把自己包装成完美形象，观众更在意能否感到内容有用和真诚。作为前一段补充，避免把“不纠结外表”理解成完全忽视呈现。\n- **01:36–02:14｜误区三：把镜头当成审判。** 描述开机后担心自己讲得对不对、会不会被笑，建议把镜头另一端想成一个具体、愿意听解释的朋友，按视频聊天的方式表达。画面中举手机靠近观看、手势指向屏幕，配合“对一个人说”的提示，示范与论点相扣。局限是没有提供对社交焦虑或更复杂表达情境的区分。\n- **02:14–02:40｜把“表演好坏”换成“对方听懂没有”。** 延续第三点，要求创作者把注意力放回听者理解，而不是自我表现评分。内容是认知重心的转换，适合做拍前自我提示；仍需主代理复核手机示范是否有剪辑或屏幕文字变化。\n- **02:40–03:00｜误区四：死记硬背逐字稿。** 指出逐字记忆会让人更怕遗漏、越怕越容易卡。建议先写大纲、开头、关键点和结尾，再用自己的话表达；若必须照稿，可尝试提词器。画面出现提词器手机示意和AI滚动字幕演示截图，且讲者现场持手机配合说明。工具演示比纯口头建议更具体，但未比较不同设备的眼神效果。\n- **03:00–03:01｜用账号关注引导收尾。** 回扣前述练习并接上带学员的服务CTA；商业转化承诺不是本条方法论证据。\n\n## 表现与判断\n\n主张是镜头紧张可通过降低完美主义、减少对外表的过度关注、把镜头对象具体化、从逐字背稿改为提纲表达来缓解。四段均以“误区—替代做法—个人经历/例子”推进，数字标题常驻，黄色重点词和箭头辅助层级；讲者用手机、身体动作及旧视频截图把抽象建议可视化。可学习表达是先否定常见但不精确的归因，再给观众一个下一次拍摄即可试的动作。局限是建议主要来自个人经验，未展示学员前后对比，也没有讨论不同内容类型或提词器导致的视线问题；末尾CTA较突然。\n\n时间线比较候选：本条在9月5日发布，接续9月2日的整体镜头呈现/账号观感话题，议题从“观众如何感受画面”转到“创作者如何更自然地面对镜头”，有可能是同一创作主题的补充，但不能据此认定系列关系。与8月31日“第三者视角”也有方法论上的候选延续：一个审视成片，一个调整创作状态；待主代理跨片复核。\n\n复核：本次逐一看过contact_01–23，ASR与可读字幕已交叉核对四项顺序及建议动作；未做全帧frame_scan候选语义复核（留待主代理）。后续重点原帧核查00:00小窗、00:48–01:20素材叠层、01:36–02:14持手机模拟对话、02:40–02:59提词器/AI示例切入退出。原始5430帧已保留；2fps联系表是视觉时间线抽样，不等于逐帧语义检查。\n\n\n", "ocr": "本条没有独立OCR时间线。烧录字幕仍在完整视频中。", "media": {"id": "7682035066289114378", "publication_time": "2026-09-05 20:59", "pinned": false, "title": "拍视频紧 的经历。因此不能把7月13日当作本次样本窗口内刚刚发生转型的日期，更不能把置顶位置当成最新时间。9月3日另一条置顶是16秒的职业青春回忆影像，不是长口播教程。\n\n## 沿时间线看，不预设线性成长\n\n| 时间区间 | 此区间的内容线索 | 可以判断什么 | 暂不能判断什么 |\n|---|---|---|---|\n| 5月21日至6月13日 | 起步成本、评价压力、完美主义、服务流程、课程与私教区别、拒绝不合适客户、垂类选题、无反馈期执行 | 账号早期已把表达心理与真实业务交付放在一起；不是先纯讲拍摄，后来才突然商业化 | 不能凭单条宣传判断学员效果、营收或服务质量 |\n| 6月18日至7月13日 | AI影像活动、空心人批评、教培案例、字体技巧、状态洁癖、线下交流、博主/IP对照 | 核心议题反复指向“内容里要有具体的人”；形式同时包含活动记录、工具技巧和长观点口播 | 题材切换不能直接当成方向变化；已有Vlog不能说9月才开始拍 |\n| 7月21日至8月31日 | 变现节点、内容组合、自曝短板、眼镜反光、有播放不涨粉、线下分享、第三者视角 | 内容逐渐把人格与用户理解、账号承接、反馈复盘明确连接 | 没有转粉/咨询/成交后台，无法检验这套系统实际效率 |\n| 9月2日至9月29日 | 整体观感、紧张与忘词、手势示范、客资原则、人群定位、不敢卖、重复触达、活人感、宝妈方向、创业Vlog、镜头交流 | 同一时期也有不同功能作品；自然表达被细化为构图、视线、手势、准备和人物态度 | 不能把34秒示范与3分钟论述的时长差异当作整体风格突变 |\n\n这些区间是为了阅读方便，而不是已经证明的四次策略转型。跨区间存在大量延续，真正的变化要落到具体句段。\n\n## 三组必须保留的张力\n\n### 1. 从人设消耗，到允许状态，再到有准备的自然\n\n5月21日“看完再决定”约144–159秒，把持续输出、把自己活成人设、不敢展示负面或不够高能量状态作为隐性成本，179.5–183秒更明确表示自己不会把那种未整理的日常状态公开给观众。但5月23日约81–122秒，她已经鼓励“粗糙感＋真实感”。7月10日“状态洁癖”约40–48秒展示自己没洗头的旧视频，88–95秒强调不少好内容来自当下真实、顺手、没有负担的表达。9月22日“活人感”约24–32秒指出自然的内容背后可能有数天选题思考和反复改提纲，后段又要求允许小缺点，但仍要让观众看见认真。\n\n这里可以观察到强调重点在移动，但5月21日和23日仅相隔两天，说明题材任务本身也会影响她强调哪一侧。较稳妥的推断是，她在寻找“允许自己不完美”与“对观众负责”的平衡，9月把准备和完成度的边界说得更显性；没有直接自我修正声明，不能断言她在某一天推翻了旧观点。也不能把这些作品合成“她一直认为随便拍就行”。\n\n### 2. 不追爆款的IP，与很强的爆款承诺\n\n7月13日置顶的经营重心是被同频用户记住，不把单条点赞当唯一尺度；但6月12日律师IP、7月3日教培、9月15日人群定位内容仍使用很强的结果承诺或爆款入口。这种张力并非只存在于远期与近期，早期作品已同时出现。6月5日教培视频约87–103秒批评“99%家长不知道”式套路钩子，而6月13日又用“保持在牌桌上就赢了90%的人”作入口。批评套路与使用强判断共存，不能简单归纳为她早期追爆款、后来彻底放弃。\n\n一种有证据支持的解释是：她区分经营目标与吸引注意的表达方式，核心经营目标是信任和业务，开头仍用强承诺把人拉进来。但这只是对作品组合的解释，不能替她证明所有说法一致。对“必火”“很容易获客”等结论，视频中的截图和作者自述不足以构成可推广的保证。\n\n### 3. 克制过度表演，与主动教授表现技巧\n\n9月2日谈整体观感，反对不匹配的强推销和夸张话术；9月9日教七种手势，9月29日教机位、留白和视线。它们不必然互相否定：前者谈适配，后者谈可练习的身体表达。但这个边界不能被省略成“表现越大越好”。\n\n6月1日原帧已经有抬眉、皱眉、视线移开再回看、双手展开和指点。近期视频更显著的变化是将这些能力命名、拆解并现场演示，而不是从早期呆板突然变得有表现力。本样本不能证明她的镜头能力按月份持续上升。\n\n## 口播内容如何组织注意力\n\n观点类常用“强判断/反常识入口—承认常见想法—重定义问题—个人或学员例子—方法清单—记忆句”推进。比如7月13日用两种经营问题作成对总结；6月13日把坚持拆成反馈依赖、微小闭环、身份认同；8月31日将换位思考拆成冷却、发给朋友前的自查、数据复盘。可学习的是替代问题和具体动作，不只是强态度标题。\n\n行业内容通常先让受众认出自己的困境，再把抽象专业转成具体处境。6月12日律师内容区分案源阶段，再列场景拆解、认知纠偏、主题Vlog和能力证明；6月6日则用“听过原则却仍拍不出来”解释私教纠偏。服务角色因此同时在“教方法”和“说明为什么需要陪跑”之间运转。\n\n她的证据主要是亲历、自述、学员反馈截图和小窗案例。这些画面具有表达上的可信度作用，但研究时必须分开两层：确实展示了某种材料，与材料证明服务效果，是不同结论。本研究不把片中营销结果当成独立核验的事实。\n\n## 表现方式：自然感由哪些可见动作构成\n\n画面常以竖屏中近景或近景让人物占据主体，桌边、居家、窗边、手持自拍等环境轮换；麦克风、手机和白笔既是使用物，也常成为解释道具。表情不是长期微笑：疑问时抬眉、否定或自嘲时皱眉、结论处前倾，视线会偏移再回来。手势常承担数目、两边对比、过程分区、情绪强调，而不是只填满画面。\n\n字幕承担两种不同职责。长观点视频用白字主句、黄色关键词、编号和案例小窗把逻辑拆层；短动作教程的字幕本身就是教学主体。9月9日7–30秒应按动作与用途读，不能因ASR未识别出连续口播就判断中段没有内容。该段站姿半身/中景让腰线及手势可见，侧向对镜头外的想象对象示范；约30.133秒转正面较近景作关注引导。原帧显示数数手对应步骤，双手分割对应分区，抓握手对应紧张，搓手/自握手对应分享或回忆。\n\n具体复核还校正了9月29日的一处易误解：约18–25秒“一拳”是头顶至画面上缘的留白示范，不是脸距镜头一拳；眼睛位于九宫格第一条线。25.2–25.7秒逐原帧可见相机视角连续变化，不能一概写成跳切。动作、构图和字幕要一起看，单凭标题或自动转写很容易弄错。\n\nVlog承担的任务不同：线下分享、活动体验、辅导和创业日常给职业身份提供现场情境，较短的旧职场影像给经历提供另一侧面。它们不应被强行用长口播的论证密度评分，也不能仅凭镜头中有听众就证明授课或获客效果。\n\n## 关于她在想什么：分层判断\n\n**较高把握：**她反复强调个人经历、具体立场、执行、用户理解和业务信任；内容中较早就有明确的服务筛选边界。这些来自跨日期多条作品。\n\n**中等把握的解释：**她可能希望让受众接受“真实的人格可以被有意识地组织成内容”，并把自然表达与专业准备兼容。7月的短板框架、8月的用户视角、9月的自然表达细节支持这条解释，但不能当作本人未说出口的内心事实。\n\n**证据不足：**她是否因为某次数据变化而改风格、近期实际获客是否更强、何时完成个人转型、每条作品是否属于预设课程系列。发布日期和成片无法单独回答这些问题。\n\n## 方法与边界\n\n选取主页2条置顶与最近38条非置顶，去重后40条，以详情页真实发布时间排序；采集时点为2026年10月2日。所有视频完整保存，原帧率30fps，总时长85分41秒，154,227帧；原时间戳索引与解码、磁盘帧、机械扫描数量核对一致，未发现缺帧。\n\n逐视频初读覆盖完整2fps时间线联系表，再以字幕、可用本地音轨转写/OCR、变化候选和重点连续原帧作复核。全帧机械扫描不等于模型逐帧理解全部154,227帧。可逐原帧浏览的本地查看器保留了后续追证入口；具体每片已看范围记录在逐视频报告中。\n\n40条均完成本地整段音轨ASR处理；这不意味着每秒都有人声或均能准确识别。回忆蒙太奇、现场记录及画面教学的内容还依赖画面与烧录字幕。独立OCR为部分视频的辅助校准，按每8个原帧取一帧，实际约3.75fps；完成数量以覆盖表为准，不虚称40条都完成独立OCR。\n\n本环境不能直接听取完整音轨；音轨由本地ASR转写，错误以可读烧录字幕校正。因此这里研究口播文字、结构、表情、视线、手势、构图和可见剪辑，不虚构音色、语调、音乐或声音停顿的主观评价。\n\n素材取得、解码、全帧差异扫描及识别均在本地进行；机械整理由Luna分工，主分析者负责时间线解释与关键证据复核。不对每个重复画面使用大模型，已有文件和识别结果复用；没有编造额度节省百分比。完整视频与研究材料集中保存于E盘。\n\n## 40条作品索引（由早到晚）\n\n查看器可按月份、置顶或关键词筛选，并直接查看各片分析、完整视频及原帧。标题过长的作品仅保留开头，完整标题仍在查看器和原作品中。\n\n| 日期 | 作品 | 置顶 |\n|---|---|---|\n| 2026-05-21 12:31 | [关于“违规”这件事](https://www.douyin.com/video/7642198121565146484) |  |\n| 2026-05-21 18:06 | [看完了再决定自己要不要做自媒体](https://www.douyin.com/video/7642284257615875379) |  |\n| 2026-05-22 15:51 | [最近做自媒体有点小 o/7690531649808813321) |  |\n| 2026-09-29 16:39 | [口播视频怎么提升镜头交流感实操起来](https://www.douyin.com/video/7690874093255527706) |  |\n\n## 证据入口\n\n- `per_video/<视频ID>.md`：40份独立分析，记录逐段内容、可见表现、已看范围与未做的复核。\n- `root_verification.md`：主分析者实际查看的独立证据及纠错；连续原帧抽查见 `evidence/dense_manifest.json`。\n- `coverage.md` 与 `catalog/chronological40.json`：选择范围、真实日期、媒体及处理覆盖。\n- `sources/<视频ID>.mp4`：完整本地视频；`work/<视频ID>/timestamp_index.json` 与 `all_frames/`：原帧定位。\n- `研究查看器.html`：本地交互入口。所有相对路径均位于 `E:\\DouyinResearch\\43101871626`。\n", "focused": "# 近两个月：内容节奏、服务销售与选题方法\n\n这份分析回应“做个人IP＋个人服务销售可以学什么”。窗口按2026年10月2日向前两个月，使用已采集作品中8月2日至10月2日的15条公开作品；最新作品为9月29日。日期是作品真实发布时间，不把置顶视作近期。内容编排的作用是研究者解释，不能由发布日期证明作者的预设策划或实际成交效果。\n\n最值得借鉴的是：把服务中的诊断、练习、纠偏与交付过程变成观众能体验的内容。观众先得到一次有用的判断，再逐渐知道她能帮谁、怎样帮、为什么值得付费。她确实也有明确营销和直接引导，不能美化成全程不推销。\n\n## 1. 发布与内容节奏\n\n8月有3条，分别8月19、25、31日，间隔都是6天。9月有12条，间隔1–4天，中位数2天，平均约2.45天。这是样本内公开发布节奏，不包含删除、私密或未发布作品。没有证据据此判断她实际拍摄频率。\n\n按主要内容任务作研究者分类（部分作品兼任多个任务）：\n\n| 主要任务 | 条数 | 作品 |\n|---|---:|---|\n| 内容经营与变现 | 5 | 8/19有播放不涨粉、8/31第三视角、9/11有流量没客资、9/19不敢卖、9/20重复触达 |\n| 镜头表达与呈现 | 5 | 9/2整体观感、9/5紧张忘词、9/9七手势、9/22活人感、9/29镜头交流 |\n| 特定人群的定位与选题 | 2 | 9/15中女人设、9/26宝妈方向 |\n| 工作现场与关系 | 2 | 8/25线下分享、9/28创业Vlog |\n| 个人经历 | 1 | 9/3旧职场回忆，置顶 |\n\n这15条不是同一主题的机械重复：镜头技巧给人即时收益；经营内容让人理解为什么“拍了”仍不成交；人群内容让特定观众觉得自己有机会；工作现场让服务与职业身份可见；旧职场回忆补充人物经历。\n\n实际顺序能看出这种轮换：9/5表达障碍→9/9短动作示范→9/11获客诊断；9/15某类人的机会→9/19服务价值与定价→9/20持续触达；9/22自然表达→9/26宝妈定位→9/28服务工作现场→9/29镜头实操。可以将其解释为围绕同一类客户的不同卡点持续展开，不能确认她有意设计了这几组系列。\n\n她9/20建议每月20–30条，但本人本次9月公开样本是12条。学习实际的内容组合，不要把她讲的频次当作本人已实现的节奏或普遍有效的标准。\n\n## 2. 服务如何进入内容\n\n### 诊断本身先让人体验专业判断\n\n9/11“有流量没客资”把问题拆成人群、需求、信任三个断点。她没有从陪跑项目介绍开始，而是先解释为什么你做了许多内容仍没有咨询，并举具体选题改写例子。其销售作用可能是让观众发现自己缺少定位、内容和承接的整体判断；这属于机制解释，没有后台数据证明观众因此下单。\n\n你可以学习：每条围绕一个具体客户问题，展示你检查什么、如何区分不同原因、为什么先做某一步。比反复介绍“我有经验”更容易让人看见经验如何工作。\n\n### 学员作为观点的来源与例子\n\n9/15约4.5–6秒，画面明确说近期在复盘陪跑学员数据，随即介绍中女人设的机会。陪跑身份在“这个判断从哪里来”的位置出现。9/19约42秒开始，学员困境成为价值定价观点的案例，之后再讲自己的定位、内容和获客支持。\n\n这种内容同时传递“我遇到过类似情况”和“我知道如何处理”。案例若只有夸奖或惊人结果，更像广告；如果有原问题、判断依据、干预步骤、变化和适用限制，才更能展示能力。片中收入、播放和‘值百万’等说法来自作者或客户自述，本研究不验证它们。\n\n### 公开方法同时预览交付方式\n\n8/31约57–64秒，讲第三视角时给出5–7天冷却时间，并说会让进阶学员先写几篇稿子、不急着发。服务角色自然进入方法讲解，观众能看到带练的一小段实际形态：布置任务、留时间、回看。\n\n你可以学习：免费内容完整解决一个小问题；个人服务则处理具体个案的诊断、取舍、反馈、实施和迭代。两者价值不同，不需要故意把免费内容讲残缺来逼购买。\n\n### 在真正的决策卡点上给入口\n\n9/26约112–115秒，在讲差异化人设、专属标签时出现“不知道怎么找”的表述，并在音轨转写中接入陪跑邀请。这里位于第二项人设定位末尾、第三项变现方式之前，并非全片最后才突兀加广告。此前她已经讲出了可拍方向；入口对应的是“我知道方向很多，但不知道自己该选哪一个”。字幕和ASR细节不完全对应，因此这里记录结构和含义，不作逐字引用。\n\n你可以学习：先让观众知道有解，再让观众知道哪一步需要结合本人情况作判断。服务邀请应说明能帮助处理的具体问题，而不是无关地插入职业头衔。\n\n### 工作现场让服务具象化\n\n8/25是授课、答疑、拍摄辅导与线下交流；9/28包含回复学员、交付、活动分享和客户互动。它们让人看到与她工作是什么样的，而不只是听服务介绍。现场有客户和反馈不等于效果被验证，重要的是让工作步骤、沟通方式和服务关系可见。\n\n你可以学习：只拍真实存在且可公开的工作片段。讲清这一刻在解决什么；不要只展示忙碌、电脑或合影，却让人看不懂客户为什么需要你。\n\n## 3. 对她的植入方式要保留判断\n\n她不是完全没有直接推销。9/5、9/9、9/11都有结尾关注引导；9/19用高投入客户和‘陪跑值百万’建立价值锚点，营销感更强；9/15‘必爆’入口也强于所展示证据。你希望的克制风格更适合重点学习8/31的方法中展示交付、9/26卡点上的服务承接、9/28真实工作过程，不必复制所有夸张承诺。\n\n账号里不同内容可共同回答：你懂我的问题吗？你有办法吗？这个办法适合我吗？与你一起做是什么体验？我为什么要付费？这是研究者归纳的购买判断链，不是已观测到的用户成交路径。\n\n服务身份应该能被找到。自然植入不等于让客户猜到底怎么购买：内容建立理解和信任，主页说明服务对象、问题、方式、边界与咨询入口。并非每条都必须导向购买，也不宜把普通评论互动伪装成免费的个案诊断。\n\n## 4. 选题方法：从客户问题长出内容\n\n### 围绕一类客户的不同阶段选题\n\n从近期作品可以整理出：不敢开始（9/5）→表达不自然（9/9、9/29）→不知道持续提供什么（8/19、9/20）→有观看却无咨询（9/11）→不知道自己的优势与定位（9/15、9/26）→不敢销售（9/19）。并非按日期严格顺序教授，而是在客户不同阶段之间轮换。\n\n对你而言，先写出目标客户从‘想改变’到‘已经尝试仍卡住’再到‘选择付费帮助’的过程。你的选题从这些真实卡点里找，不只从行业热点里找。\n\n### 用客户的表面困扰展示自己的深一层判断\n\n例如有流量没客资，可能需要分别看人群、需求、信任；紧张忘词，可能涉及一次完美、过度自我审查与逐字背稿。内容的专业感来自有依据地重新诊断，不能为了反常识而一律否定客户判断。\n\n可用选题结构：‘你以为卡在A，先检查B是否成立’、‘同样遇到X，我为什么先问这三个问题’、‘这两个症状很像，但解决顺序不同’。视频里必须给判断条件或实例，不要只有吸睛标题。\n\n### 把服务中反复出现的问题当作素材源\n\n9/11用提问截图起题，9/15说来自学员复盘，9/19用定价顾虑与服务个案讲价值。可观察到内容与工作经验连接，但不能确认她全部选题的幕后流程。\n\n你可整理：客户初次咨询的问题、经常误会的地方、总在同一步卡住的原因、交付中反复解释的判断、做完之后才理解的事。没有客户案例时，使用真实自经历或明确标作演示的案例，不编造客户故事。\n\n### 同一能力用不同人群与情境表达\n\n9/15讲中年女性，9/26讲宝妈，核心仍是把个人经历、内容来源、人设和变现对应起来。受众称呼和生活情境变具体，使人容易认出自己。对你而言，不必为了做多个选题而增加多个无关业务，可以让同一服务能力出现在不同客户情境中。\n\n### 从一个实际问题拆出内容组\n\n以下是可借鉴的创作方法，不声称是她亲自公布的工作流：\n\n| 同一客户问题可拆成 | 内容回答什么 | 服务如何自然出现 |\n|---|---|---|\n| 症状题 | 哪种情况下需要重视这个问题？ | 先帮助观众识别本人处境，不必植入服务 |\n| 诊断题 | 为什么你做了很多仍无改善？ | 展示真实检查顺序和区分依据 |\n| 小方法题 | 今天可以先做哪一步？ | 演示一小段可独立完成的练习 |\n| 案例题 | 类似的人怎样作出选择？ | 讲原问题、干预步骤与限制，不只晒结果 |\n| 过程题 | 我处理这个问题的一次实际工作 | 让交付、反馈与协作方式可见 |\n| 选择题 | 哪些情况适合自行做，哪些值得找帮助？ | 清楚说明适用人群与服务边界 |\n\n同一问题因此可以延展数条，但各条要新增判断或行动，不换标题重复同一个观点。\n\n## 5. 你可以直接采用的内容写法\n\n一种基本结构：具体场景→观众原本以为的原因→你的判断与条件→一个可执行动作→真实案例或工作过程→适用边界→有需要时给清楚的服务入口。\n\n以下为虚拟写法示例，不是她的原话，也不代表你已有这种客户经历：\n\n‘如果你已经试过A、B，仍然卡在X，先别急着继续加量。我会先检查这三个地方……今天你可以先完成第一个检查。剩下两项要结合你的具体情况，不能用同一个答案。我的这项服务会先做诊断，再确定执行顺序和反馈方式；适合的情况与流程在主页说明里。’\n\n有真实个案后，可把中段换成：‘这个客户起初以为是A。我先看了B，发现……所以第一步没有做C，而是做D。’观众能从判断过程认识能力，服务介绍便有上下文。\n\n不是每条都需要这整个结构。短方法片可以只给一个动作，观点片可以只纠正一个误区，工作记录可以只呈现一次关键反馈；整组内容共同承担信任和购买说明。\n\n## 6. 一个可执行的起步内容组\n\n先围绕同一类客户、同一项真实服务做6条：两条问题诊断、一条小方法、一条真实案例或标明的演示、一条真实工作过程、一条适合谁/不适合谁的说明。这个数量是起步实验建议，不是作者固定比例，也不是平台规则。完成并复盘后再调整频率。\n\n选题发布前问：目标客户能认出自己的处境吗？这条能显示我怎样判断或做事吗？观众不付费也能拿走一个有效收获吗？如果出现服务，它与当前问题有直接关系吗？\n\n评估时除播放、点赞外，记录有效咨询：对方是否属于你服务的人群，是否主动描述具体问题，是否知道你提供什么，以及咨询后为什么购买或没有购买。暂时没有成交时，这些也能帮助你分清‘大家赞同’与‘目标客户理解你的服务’。\n\n## 核验与来源\n\n沿用40条研究的完整视频、2fps视觉时间线、烧录字幕与本地ASR。此次重新读近期逐片记录与重点转写，并实际核对8/31约56–63.5秒、9/15约0–7.5秒、9/19约40–47.5秒、9/26约112–119.5秒的联系表。9/26服务承接位置修正为中段人设定位部分，不沿用旧报告的结尾说法。没有主观听音或客户成交后台数据。\n\n- [8/31：第三视角](https://www.douyin.com/video/7680178520898719022)\n- [9/11：有流量但没客资](https://www.douyin.com/video/7684286923635952896)\n- [9/15：中女人设](https://www.douyin.com/video/7685742833872964891)\n- [9/19：不敢卖](https://www.douyin.com/video/7687189281684688143)\n- [9/26：宝妈方向](https://www.douyin.com/video/7689859557471898934)\n- [9/28：创业Vlog](https://www.douyin.com/video/7690531649808813321)\n\n文件位于E:\\DouyinResearch\\43101871626\\reports\\近两个月_内容节奏与服务销售选题.md。\n"};let selected=null,mode='asr';const rows=DATA.rows;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')}
function md(s){let out='',list=false,table=false;for(let line of s.split(/\r?\n/)){if(/^\|/.test(line)){if(list){out+='</ul>';list=false}if(!table){out+='<table>';table=true}if(!/^\|[\s:|-]+\|?$/.test(line))out+='<tr>'+line.split('|').slice(1,-1).map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';continue}if(table){out+='</table>';table=false}if(/^[-*] /.test(line)||/^\d+\. /.test(line)){if(!list){out+='<ul>';list=true}out+='<li>'+inline(line.replace(/^([-*]|\d+\.) /,''))+'</li>';continue}if(list){out+='</ul>';list=false}let h=line.match(/^(#{1,6}) (.*)/);out+=h?'<h'+Math.min(h[1].length+1,6)+'>'+inline(h[2])+'</h'+Math.min(h[1].length+1,6)+'>':line.startsWith('> ')?'<blockquote>'+inline(line.slice(2))+'</blockquote>':line?'<p>'+inline(line)+'</p>':''}return out+(list?'</ul>':'')+(table?'</table>':'')}
function renderList(){let q=document.querySelector('#search').value.toLowerCase(),m=document.querySelector('#month').value;let shown=rows.filter(r=>(!m||r.publication_time.startsWith(m))&&(!q||(r.title+r.report+r.segments.map(s=>s.text).join('')).toLowerCase().includes(q)));document.querySelector('#count').textContent=`${shown.length} / ${rows.length} 条 · 从早到晚`;document.querySelector('#list').innerHTML=shown.map(r=>`<button class="item ${selected===r.id?'active':''}" data-id="${r.id}"><span>${esc(r.publication_time)}${r.pinned?' · 置顶':''}</span><b>${esc(r.title.split('#')[0]).slice(0,85)}</b></button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>show(b.dataset.id))}
function overview(which){selected=null;renderList();document.querySelector('#article').innerHTML='<p class="notice">视频为研究用有损版本，源帧顺序和帧数保留。机器转写含错字和漏识，不是校订逐字稿。原帧图按需提取，不预存。</p>'+md(DATA[which]);}
function panel(r){let p=document.querySelector('#panel');if(mode==='report'){p.innerHTML=md(r.report)}else if(mode==='ocr'){p.innerHTML=md(r.ocr)}else{p.innerHTML='<p class="notice">整段音轨机器识别；含错漏，可能漏掉画面教学字幕。点击一段可定位视频。</p><div class="segments">'+r.segments.map((s,i)=>`<button class="seg" data-i="${i}"><span>${s.start.toFixed(2)}–${s.end.toFixed(2)} 秒</span>${esc(s.text)}</button>`).join('')+'</div>';p.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{let v=document.querySelector('#video');v.pause();v.currentTime=r.segments[Number(b.dataset.i)].start})}}
function show(id){selected=id;let r=rows.find(x=>x.id===id);renderList();let mv=r.media.package_video||{};document.querySelector('#article').innerHTML=`<h2>${esc(r.title.split('#')[0])}</h2><p class="small">${esc(r.publication_time)} ${r.pinned?'· 置顶':''} · ${esc(mv.codec_name||'')} ${mv.width||''}×${mv.height||''} · <a href="${r.public_url}" target="_blank" rel="noopener">公开原作品</a></p><div class="media"><section><video id="video" controls preload="metadata" src="videos/${r.id}.mp4"></video><p id="position" class="small time"></p><div class="tools"><button id="play">播放／暂停</button><button id="prev">前一帧位置</button><button id="next">后一帧位置</button><button id="slow">0.5倍速</button><button id="normal">1倍速</button><button id="capture">定格当前画面</button></div><p class="small">播放器按1/30秒定位。精确提取指定帧号或连续帧，请用tools/extract_frames.py；结果留在本包frames目录。</p><details><summary>原始识别文件</summary><p><a href="transcripts/${r.id}/asr.txt">机器转写TXT</a> · <a href="transcripts/${r.id}/asr.srt">机器字幕SRT</a> · <a href="transcripts/${r.id}/asr.json.gz">完整ASR源JSON.gz</a> · <a href="transcripts/${r.id}/source_timestamp_index.json.gz">源时间戳索引</a></p></details></section><section><div class="tools"><button id="asr">逐段机器转写</button><button id="report">单片研究</button><button id="ocr">画面字幕OCR</button></div><div id="panel"></div></section></div>`;let v=document.querySelector('#video');v.ontimeupdate=()=>document.querySelector('#position').textContent=`${v.currentTime.toFixed(3)} 秒 / ${v.duration.toFixed(3)} 秒`;v.onloadedmetadata=v.ontimeupdate;document.querySelector('#play').onclick=()=>v.paused?v.play():v.pause();for(let [id,d]of[['prev',-1],['next',1]])document.querySelector('#'+id).onclick=()=>{v.pause();v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+d/30))};document.querySelector('#slow').onclick=()=>v.playbackRate=.5;document.querySelector('#normal').onclick=()=>v.playbackRate=1;document.querySelector('#capture').onclick=()=>{let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.style.maxWidth='100%';let old=document.querySelector('#still');if(old)old.remove();c.id='still';document.querySelector('#position').after(c)};for(let id of ['asr','report','ocr'])document.querySelector('#'+id).onclick=()=>{mode=id;panel(r)};panel(r)}
[...new Set(rows.map(r=>r.publication_time.slice(0,7)))].forEach(m=>{let o=document.createElement('option');o.value=m;o.textContent=m;document.querySelector('#month').appendChild(o)});document.querySelector('#month').onchange=renderList;document.querySelector('#search').oninput=renderList;document.querySelector('#overview').onclick=()=>overview('summary');document.querySelector('#focused').onclick=()=>overview('focused');overview('focused');</script></html>
